name: CI

# **これは lily が別リポジトリへ出たときのワークフロー。** いまは
# fushihara.net の中にあるので 1 バイトも動かない（GitHub がワークフローを読むのは
# リポジトリ直下の `.github/` だけ）。分離を `lily/` の移動 1 回で済ませるために、
# 持っていくものを最初からここに置いてある。
#
# 分離するまでのあいだ、lily の typecheck と test を実際に回しているのは
# fushihara.net の `.github/workflows/deploy-blog.yml` の `lily` ジョブ。
# **中身を変えたら両方直すこと**（分離したら向こうは消える）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # **emit を型検査とは別に回す。** `typecheck` は `--noEmit` なので、
      # emit だけが壊れる状態（`rootDir` の外のファイルを import した等）を通す。
      # 配るのは emit したものなので、ここで落としておかないと publish で初めて分かる。
      #
      # **`build` ではなく `build:lib`。** 管理画面 (`build:admin`) は次の
      # `npm test` が `pretest` で作るので、`build` にすると vite が 2 回走る。
      - run: npm run build:lib
      # 実 workerd + 実 D1。`pretest` が管理画面とテスト用の静的アセットを用意する。
      - run: npm test
