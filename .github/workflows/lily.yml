name: CI / lily

# lily は blog/ を置き換えるために並走させている別プロジェクト。
# まだ何も配信していないので、ここにあるのはテストだけ。デプロイのジョブは
# /blog-next* での並走を始めるときに足す。
on:
  push:
    branches: [main]
    paths:
      - 'lily/**'
      # shared/ も見る。lily は shared/date.ts（公開日時の JST 変換）を読み、
      # ビルドが shared/public を配信物にコピーする。ここを外すと、shared だけの
      # 変更で壊れても気付けない。
      - 'shared/**'
      - '.github/workflows/lily.yml'
  pull_request:
    paths:
      - 'lily/**'
      - 'shared/**'
      - '.github/workflows/lily.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: lily

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lily/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # E2E は wrangler dev に対して回す。末尾スラッシュの補完も 404 の解決も
      # Workers の配信側の挙動なので、別のサーバー相手では本番を検証したことにならない。
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lily-playwright-report
          path: lily/playwright-report/
          retention-days: 7
