name: CI / app

# ランチャー（app.fushihara.net、issue #56）は本体ともブログとも別の Worker なので、
# ワークフローも分けてある。静的アセットだけで毎回フルデプロイなので、本体の
# `changes` ジョブ（deployed タグとの差分判定）は持ち込まない（ブログと同じ理由）。
#
# **wrangler deploy より前に Access のアプリができていること。** アプリ側に認証は
# 無く、守っているのは Access だけ（app/wrangler.jsonc のコメント参照）。
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      # shared/ のうちビルドが読むのはこの 2 つだけ（色の連結と Blog のアイコン）。
      # app/scripts/build.ts か app/services.ts が shared/ の別のファイルを読むようになったら、ここにも足す。
      - 'shared/tokens.css'
      - 'shared/public/favicon.svg'
      - '.github/workflows/deploy-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'shared/tokens.css'
      - 'shared/public/favicon.svg'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read

# 続けて push したとき、古いほうの deploy が後に終わって新しい版を上書きしないよう、
# 1 本ずつ順に流す（実行中のものは止めない）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # E2E は wrangler dev に対して回す（_headers の適用は Workers の配信側の挙動）。
      # ビルドは playwright.config.ts の webServer が行う。
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: app-playwright-report
          path: app/playwright-report/
          retention-days: 7

  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
