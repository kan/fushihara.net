name: CI / blog

# ブログ (lily) は本体とは別の Worker なので、ワークフローも分けてある。
# 記事を 1 本足しただけで本体の E2E まで回るのを避けるのが目的。
#
# 本体の deploy.yml にある `changes` ジョブ (deployed タグとの差分判定) は
# 持ち込んでいない。上の paths フィルタが既に「ブログに関係する変更のときだけ
# 動く」を保証しているうえ、毎回フルデプロイなので、テスト失敗で出し損ねた
# 変更も次の push で丸ごと出し直される。
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      # shared/ も見る。ブログは shared/date.ts（公開日時の JST 変換）を読み、
      # ビルドが shared/public を配信物にコピーする。ここを外すと、shared だけの
      # 変更で壊れても気付けない。
      - 'shared/**'
      - '.github/workflows/deploy-blog.yml'
  pull_request:
    paths:
      - 'blog/**'
      - 'shared/**'
      - '.github/workflows/deploy-blog.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: blog

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # E2E は wrangler dev に対して回す。末尾スラッシュの補完も 404 の解決も
      # Workers の配信側の挙動なので、別のサーバー相手では本番を検証したことにならない。
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blog-playwright-report
          path: blog/playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      # wrangler.jsonc の assets.directory が dist/ を指すので、これが無いと
      # デプロイする中身が無い (静的アセットのコピー + 管理画面のビルド)。
      - run: npm run build
      # **マイグレーションはデプロイより先。** 逆にすると、新しい列を読むコードが
      # 古いスキーマに当たる時間ができる。裏を返すと migrations/ は追加のみで
      # 書くという前提で、列や表を落とすときはこの順序では守れない
      # (そのときは 2 回に分けて出す)。
      - run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # -c を明示するのは、リポジトリ直下に .wrangler/deploy/config.json が
      # 残っていると「どちらの設定か分からない」で落ちるため。
      - run: npx wrangler deploy -c ./wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
