name: CI / blog

# ブログは本体とは別の Worker なので、ワークフローも分けてある。
# 記事を 1 本足しただけで本体の E2E まで回るのを避けるのが目的。
#
# **CMS の本体は [`@kanf/lily`](https://github.com/kan/lily) で、`blog/` はその
# 利用側。** あちらは別リポジトリなので、lily を上げるのは dependabot の PR か
# 手での `npm install` 経由になり、**どちらも `blog/package-lock.json` が動く**
# ―― つまり `blog/**` の paths でそのまま拾える。
#
# 本体の deploy.yml にある `changes` ジョブ (deployed タグとの差分判定) は
# 持ち込んでいない。下の paths フィルタが既に「ブログに関係する変更のときだけ
# 動く」を保証しているうえ、毎回フルデプロイなので、テスト失敗で出し損ねた
# 変更も次の push で丸ごと出し直される。
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      # shared/ も見る。ブログは shared/date.ts（公開日時の JST 変換）を読み、
      # ビルドが shared/public を配信物にコピーする。ここを外すと、shared だけの
      # 変更で壊れても気付けない。**lily は shared/ を読まない。**
      - 'shared/**'
      - '.github/workflows/deploy-blog.yml'
  pull_request:
    paths:
      - 'blog/**'
      - 'shared/**'
      - '.github/workflows/deploy-blog.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: blog

jobs:
  # CMS そのものを見るジョブはここに無い。**`kan/lily` の CI が見ている**
  # （利用側を 1 つも知らない状態で typecheck + emit + 実 workerd の test）。
  # こちらが判定するのは、**その lily を載せた fushihara.net のブログが
  # 今までどおり配れているか**だけ。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog/package-lock.json

      # **`file:` 依存のまま push されていないこと。**
      #
      # lily を手元の木へ向けて往復するとき `npm install ../lily` を使うと、
      # `package.json` が `"@kanf/lily": "file:../lily"` に書き換わり lockfile も
      # 一緒に更新される。**両者が整合しているので `npm ci` は成功する**
      # —— 指す先が無くても dangling symlink を張って exit 0 で終わる。
      # 落ちるのは後ろの `tsc` や `wrangler` で、そこに出るのは素の
      # 「モジュールが見つからない」だけ。原因が読めないので、ここで名指しで止める。
      #
      # `npm ci` より前に置く。パッケージを入れなくても判定できるうえ、
      # 入れてから落ちると待ち時間が無駄になる。
      # **`name` は引用符で囲むこと。** `file:` を素で書くと YAML が入れ子の
      # マッピングとして読み、**ワークフローがジョブを 1 つも起こさずに落ちる**
      # （ログも残らないので、原因が画面から辿れない。実際に踏んだ）。
      - name: 'file: 依存が残っていないか'
        run: |
          if grep -q '"file:' package.json; then
            echo '::error::package.json が file: 依存のまま。`git checkout -- package.json package-lock.json && npm ci` で戻すこと（blog/README.md の「lily の直し方」）'
            exit 1
          fi

      # **lily を先にビルドする手は要らなくなった。** npm から入る `@kanf/lily`
      # には `dist/lib`（CMS 本体）も `dist/admin`（管理画面）も同梱されていて、
      # 実行時依存 (hono / shiki / zod …) も `blog/node_modules` に入る。
      # `file:` で参照していたころは、そのどれも自前で用意する必要があった。
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # E2E は wrangler dev に対して回す。末尾スラッシュの補完も 404 の解決も
      # Workers の配信側の挙動なので、別のサーバー相手では本番を検証したことにならない。
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blog-playwright-report
          path: blog/playwright-report/
          retention-days: 7

  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      # wrangler.jsonc の assets.directory が dist/ を指すので、これが無いと
      # デプロイする中身が無い (共有と専用の静的アセット + lily の管理画面)。
      - run: npm run build
      # **マイグレーションはデプロイより先。** 逆にすると、新しい列を読むコードが
      # 古いスキーマに当たる時間ができる。裏を返すと migrations/ は追加のみで
      # 書くという前提で、列や表を落とすときはこの順序では守れない
      # (そのときは 2 回に分けて出す)。
      #
      # **スキーマの実体は lily。** `wrangler.jsonc` の `migrations_dir` が
      # `node_modules/@kanf/lily/migrations` を直接指しているので、上の
      # `npm ci` が済んでいれば当てるものが揃っている。
      - run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # -c を明示するのは、リポジトリ直下に .wrangler/deploy/config.json が
      # 残っていると「どちらの設定か分からない」で落ちるため。
      - run: npx wrangler deploy -c ./wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
