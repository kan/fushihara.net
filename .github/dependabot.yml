version: 2

updates:
  # npm の依存。Dependabot の PR は deploy.yml の pull_request トリガーで
  # typecheck / Vitest / Playwright を通るので、壊れる更新はマージ前に落ちる。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # vitest 5 は @cloudflare/vitest-plugin の peer (vitest@^4.1.0) と衝突し、
      # npm ci が ERESOLVE で落ちる (PR #16 で実測)。plugin は最新の 1.1.5 でも
      # 4 系のままなので、対応版が出るまで 5.x を無視する。Worker のテストは
      # plugin の workerd プールで動いているので、plugin を捨てて vitest だけ
      # 上げる選択肢は無い。blog にも同じ ignore があるので、外すときは両方外す。
      - dependency-name: vitest
        versions: ['5.x']
    groups:
      # minor / patch は 1 本の PR にまとめる。個別に立つと数が多すぎて
      # 結局まとめてマージすることになり、レビューの単位として意味を成さない。
      # major は破壊的変更を含みうるので、まとめず個別に見る。
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  # ブログ (blog/) は lily の利用側。残っている依存は CMS 本体の
  # **`@kanf/lily`**（別リポジトリ github.com/kan/lily。npm から入る）と、
  # 自前テーマが使う hono、テストとデプロイの道具だけ。
  #
  # **lily 自身の依存はここが見ない。** あちらのリポジトリの dependabot が見る。
  - package-ecosystem: npm
    directory: /blog
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # vitest 5 が @cloudflare/vitest-plugin の peer と衝突する件。
      # 理由は本体 (directory: /) の同じ ignore に書いた。
      - dependency-name: vitest
        versions: ['5.x']
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(blog)

  # Actions のバージョン。actions/*@v4 が Node 20 前提で deprecated 警告を
  # 出しているが、ここからの PR で解消する。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
