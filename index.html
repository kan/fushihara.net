<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>kan / fushihara - Portfolio</title>

    <!-- 保存されたテーマを描画前に反映する。モジュールスクリプトは defer なので、
         これが無いと OS 設定と違うテーマを選んだ訪問者に一瞬ちらつきが出る。
         保存値が無いときは何もせず、style.css の prefers-color-scheme に任せる。 -->
    <script>
      try {
        var t = localStorage.getItem('fushihara-net-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <!-- 並び順に意味がある。.ico を先に置くと、SVG に対応するブラウザは後者を選ぶ。
         実体と使い分けは CLAUDE.md の「favicon」節。 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- OGP -->
    <meta property="og:title" content="kan / fushihara - Portfolio" />
    <meta property="og:description" content="kan (fushihara) のポートフォリオサイト" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fushihara.net" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@__kan" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- サイトの見出し。ボードの中（#app）には置けない。wema のサニタイザが
         svg を落とすため（テーマトグルが外にいるのと同じ理由）。
         マークは favicon と同じ形。`f` は currentColor なのでテーマに追従し、
         丸だけ favicon と同じオレンジで固定する。 -->
    <h1 class="site-brand">
      <svg class="site-brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="currentColor" d="M25.8 6 L32.9 6 Q34.6 6 36 7.6 L34.7 13.9 L28.9 13.9 C27.4 14.1 26.5 15.6 26.5 18 L26.5 22 L33.1 22 L33.1 29.5 L26.5 29.5 L26.5 58 L17 58 L17 29.5 L12 29.5 L12 22 L17 22 L17 16.2 C17 11.5 21.8 6 25.8 6 Z"/>
        <circle cx="45.6" cy="52.4" r="6.2" fill="#FF6B00"/>
      </svg>
      fushihara.net
    </h1>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
